[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audioflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.2",
    "mutagen>=1.47.0",
]

[project.scripts]
audioflow = "audioflow.main:app"

